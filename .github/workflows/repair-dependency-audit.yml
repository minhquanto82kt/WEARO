name: One-time dependency audit repair

on:
  push:
    branches:
      - feature/product-admin
    paths:
      - ".github/dependency-repair.request"
      - "fashion-dream-try-on-main/src/data/products.ts"
      - "fashion-dream-try-on-main/src/routes/new-arrivals.tsx"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: fashion-dream-try-on-main
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-smoke-test-placeholder
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feature/product-admin
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fashion-dream-try-on-main/package-lock.json

      - name: Update Vite to patched release and refresh lockfile
        run: npm install --save-dev vite@8.3.5 --legacy-peer-deps --no-audit --no-fund

      - name: Apply compatible advisory fixes
        run: npm audit fix --legacy-peer-deps --no-fund

      - name: Require a clean high-severity audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Architecture boundary audit
        run: npm run audit:architecture

      - name: Invariant and commerce tests
        run: |
          npm run test:phase-b-c
          npm run test:phase-d-e
          npm run test:customer-flows
          npm run test:phase-f-security
          npm run test:replicate-provider

      - name: Start local app for smoke tests
        shell: bash
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 8080 > /tmp/wearo-dev.log 2>&1 &
          echo $! > /tmp/wearo-dev.pid
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wearo-dev.log
          exit 1

      - name: Route and customer experience smoke tests
        env:
          BASE_URL: http://127.0.0.1:8080
        run: |
          npm run test:smoke
          npm run test:customer-experience

      - name: Commit validated dependency changes and remove one-time workflow
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fashion-dream-try-on-main/package.json fashion-dream-try-on-main/package-lock.json
          git rm .github/workflows/repair-dependency-audit.yml .github/dependency-repair.request
          if git diff --cached --quiet; then
            echo "No validated dependency changes to commit."
            exit 1
          fi
          git commit -m "fix: update Vite and resolve high-severity dependency audit"
          git push origin HEAD:feature/product-admin
          gh workflow run ci.yml --ref feature/product-admin
