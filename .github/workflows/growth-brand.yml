name: Growth and Brand Governance

on:
  push:
    branches:
      - feature/product-admin
  pull_request:

permissions:
  contents: read

jobs:
  growth-brand:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fashion-dream-try-on-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify Growth/SEO foundations
        run: |
          test -f src/lib/seo/seo.ts
          test -f src/lib/analytics/analytics.ts
          test -f src/lib/seo.ts
          test -f src/lib/analytics.ts
          grep -q 'canonicalLink' src/lib/seo/seo.ts
          grep -q 'organizationSchema' src/lib/seo/seo.ts
          grep -q 'websiteSchema' src/lib/seo/seo.ts
          grep -q 'product_view' src/lib/analytics/analytics.ts
          grep -q 'purchase_complete' src/lib/analytics/analytics.ts
          grep -q 'ai_try_on_start' src/lib/analytics/analytics.ts
          echo 'Growth foundation: PASS'
      - name: Run WEARO brand governance
        run: node scripts/ci/brand-governance.mjs
