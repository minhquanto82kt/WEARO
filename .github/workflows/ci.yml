name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: fashion-dream-try-on-main

env:
  # Local CI only: activates the repository's deterministic Supabase catalog fixture.
  # No production data or credentials are used by the route smoke suite.
  VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-smoke-test-placeholder

jobs:
  validate:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fashion-dream-try-on-main/package-lock.json

      - name: Install dependencies from committed lockfile
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Dependency audit
        run: npm run audit:dependencies

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Architecture boundary audit
        run: npm run audit:architecture

      - name: Phase B-C invariant tests
        run: npm run test:phase-b-c

      - name: Start local app for route and customer smoke tests
        shell: bash
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 8080 > /tmp/wearo-dev.log 2>&1 &
          echo $! > /tmp/wearo-dev.pid
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wearo-dev.log
          exit 1

      - name: Phase D-E invariant tests
        run: npm run test:phase-d-e

      - name: Customer commerce flow contract tests
        run: npm run test:customer-flows

      - name: Smoke tests
        env:
          BASE_URL: http://127.0.0.1:8080
        run: npm run test:smoke

      - name: Customer experience smoke tests
        env:
          BASE_URL: http://127.0.0.1:8080
        run: npm run test:customer-experience

      - name: Security smoke tests
        env:
          BASE_URL: http://127.0.0.1:8080
        run: npm run test:phase-f-security

      - name: Replicate provider integration invariants
        run: npm run test:replicate-provider
